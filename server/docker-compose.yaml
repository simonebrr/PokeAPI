services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: php-server
    ports:
      - "8080:80"
    volumes:
      - ./app:/var/www/html:cached
      - ./init.php:/var/www/html/init.php
      - ./apache-config.conf:/etc/apache2/sites-available/000-default.conf
    command: bash -c "/usr/local/bin/php /var/www/html/init.php && cron && apache2-foreground"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - APACHE_DOCUMENT_ROOT=/var/www/html/public
    stdin_open: true
    tty: true
    networks:
      - my_network

  db:
    image: mysql:8.0
    container_name: mysql-database
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: app_db
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 2s
      timeout: 20s
      retries: 10
    volumes:
      - db_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - my_network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    environment:
      PMA_HOST: db # Nome del servizio MySQL a cui phpMyAdmin si connette
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: root_password # La stessa password che hai usato per MySQL
    ports:
      - "8081:80" # Porta per accedere a phpMyAdmin
    depends_on:
      - db
    networks:
      - my_network

networks:
  my_network:
    driver: bridge

volumes:
  db_data:
