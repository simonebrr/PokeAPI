services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: php-server
    ports:
      - "8080:80"
    volumes:
      - ./app:/var/www/html:cached
      - ./init.php:/var/www/html/init.php
      - ./apache-config.conf:/etc/apache2/sites-available/000-default.conf
      - storage:/var/www/html/storage
    # Salva le variabili per il cron, prepara la cartella delle foto, poi avvia
    command: bash -c "export -p > /etc/container.env && chmod 600 /etc/container.env && mkdir -p /var/www/html/storage && chown www-data:www-data /var/www/html/storage && /usr/local/bin/php /var/www/html/init.php; cron && apache2-foreground"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - APACHE_DOCUMENT_ROOT=/var/www/html/public
      # Valori presi dal file .env accanto a questo (copia .env.example)
      - CARDTRADER_TOKEN=${CARDTRADER_TOKEN:-}
      - DB_HOST=db
      - DB_NAME=app_db
      - DB_USER=app_user
      - DB_PASSWORD=${DB_PASSWORD:-app_password}
      - ADMIN_EMAILS=${ADMIN_EMAILS:-}
      - PLAN_PRICE=${PLAN_PRICE:-4.99}
      - FREE_ITEM_LIMIT=${FREE_ITEM_LIMIT:-200}
      - TRIAL_DAYS=${TRIAL_DAYS:-14}
      - APP_URL=${APP_URL:-}
      - APP_NAME=${APP_NAME:-CardLedger}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - PAYPAL_CLIENT_ID=${PAYPAL_CLIENT_ID:-}
      - PAYPAL_SECRET=${PAYPAL_SECRET:-}
      - PAYPAL_PLAN_ID=${PAYPAL_PLAN_ID:-}
      - PAYPAL_MODE=${PAYPAL_MODE:-sandbox}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_PRICE_ID=${STRIPE_PRICE_ID:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
    stdin_open: true
    tty: true
    networks:
      - my_network

  db:
    image: mysql:8.0
    container_name: mysql-database
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: app_db
      MYSQL_USER: app_user
      MYSQL_PASSWORD: ${DB_PASSWORD:-app_password}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u app_user -p\"$$MYSQL_PASSWORD\""]
      interval: 2s
      timeout: 20s
      retries: 30
      start_period: 30s
    volumes:
      - db_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - my_network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    environment:
      PMA_HOST: db # Nome del servizio MySQL a cui phpMyAdmin si connette
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
    ports:
      - "8081:80" # Porta per accedere a phpMyAdmin
    depends_on:
      - db
    networks:
      - my_network

networks:
  my_network:
    driver: bridge

volumes:
  db_data:
  storage:
